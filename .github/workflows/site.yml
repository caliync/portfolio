name: Build, test and deploy

# Every push and pull request: generate the static site with Nuxt, type-check it, and test it in a
# real browser. Pushes to main then publish that same build to GitHub Pages.
# (cali/portfolio is the branch's old name; it is accepted too until the rename is done.)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:unit
      - name: Generate the site
        run: npm run generate
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Test pages, screen sizes, accessibility and links
        run: npm test
      - name: Lighthouse scores (performance, accessibility, best practices, SEO)
        run: npm run lighthouse
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cali/portfolio')
        with:
          path: .output/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cali/portfolio')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
