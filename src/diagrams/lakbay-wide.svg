<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-lakbay-wide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahead"/></marker></defs><g class="node mine"><rect x="20" y="40" width="250" height="130" rx="12"/><text class="dt" x="36" y="70">Browser app</text><text class="dl" x="36" y="94">HTML, CSS, JavaScript</text><text class="dl" x="36" y="114">Leaflet map</text><text class="dl" x="36" y="134">Works offline (service worker)</text></g><g class="node"><rect x="20" y="230" width="250" height="104" rx="12"/><text class="dt" x="36" y="260">Owner sign-up form</text><text class="dl" x="36" y="284">Business owners add</text><text class="dl" x="36" y="304">their place</text></g><g class="node mine"><rect x="350" y="40" width="270" height="150" rx="12"/><text class="dt" x="366" y="70">FastAPI on Render</text><text class="dl" x="366" y="94">Checks every request</text><text class="dl" x="366" y="114">Rate limits, security headers</text><text class="dl" x="366" y="134">One worker</text></g><g class="node mine"><rect x="350" y="250" width="270" height="104" rx="12"/><text class="dt" x="366" y="280">Planner</text><text class="dl" x="366" y="304">Filter, score, fill each day</text><text class="dl" x="366" y="324">Same trip, same plan</text></g><g class="node"><rect x="700" y="40" width="240" height="104" rx="12"/><text class="dt" x="716" y="70">Gemini API</text><text class="dl" x="716" y="94">Rewords stored facts only</text><text class="dl" x="716" y="114">Template if it fails</text></g><g class="node"><rect x="700" y="250" width="240" height="104" rx="12"/><text class="dt" x="716" y="280">SQLite</text><text class="dl" x="716" y="304">220 places + tags</text><text class="dl" x="716" y="324">Rebuilt on each deploy</text></g><g class="node"><rect x="20" y="390" width="920" height="64" rx="12"/><text class="dt" x="36" y="420">Private GitHub repo</text><text class="dl" x="36" y="444">Owner sign-ups wait here until I review and approve them</text></g><g class="edge"><line x1="270" y1="100" x2="346" y2="110" marker-end="url(#ah-lakbay-wide)"/><text class="el" x="278" y="92">HTTPS, JSON</text></g><g class="edge"><line x1="270" y1="282" x2="346" y2="160" marker-end="url(#ah-lakbay-wide)"/></g><g class="edge"><line x1="485" y1="190" x2="485" y2="246" marker-end="url(#ah-lakbay-wide)"/></g><g class="edge"><line x1="620" y1="300" x2="696" y2="300" marker-end="url(#ah-lakbay-wide)"/><text class="el" x="646" y="292">SQL</text></g><g class="edge"><line x1="620" y1="92" x2="696" y2="92" marker-end="url(#ah-lakbay-wide)"/><text class="el" x="630" y="84">facts only</text></g><g class="edge faint"><line x1="145" y1="334" x2="145" y2="386" marker-end="url(#ah-lakbay-wide)"/></g></svg>
