<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-lakbaywise-wide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahead"/></marker></defs><g class="node mine"><rect x="20" y="40" width="250" height="130" rx="12"/><text class="dt" x="36" y="70">Nuxt 3 website</text><text class="dl" x="36" y="94">Vue 3, TypeScript, Tailwind</text><text class="dl" x="36" y="114">Leaflet map</text><text class="dl" x="36" y="134">Types made from the API</text></g><g class="node"><rect x="20" y="230" width="250" height="104" rx="12"/><text class="dt" x="36" y="260">Owner form</text><text class="dl" x="36" y="284">Business owners add</text><text class="dl" x="36" y="304">their place for review</text></g><g class="node mine"><rect x="350" y="40" width="270" height="150" rx="12"/><text class="dt" x="366" y="70">FastAPI backend</text><text class="dl" x="366" y="94">Pydantic checks every request</text><text class="dl" x="366" y="114">Plans, swaps, add and remove</text><text class="dl" x="366" y="134">Stored plans with a version</text></g><g class="node mine"><rect x="350" y="250" width="270" height="104" rx="12"/><text class="dt" x="366" y="280">Planner</text><text class="dl" x="366" y="304">Pick, time and warn</text><text class="dl" x="366" y="324">No AI in the beta</text></g><g class="node"><rect x="700" y="40" width="240" height="104" rx="12"/><text class="dt" x="716" y="70">OSRM and Nominatim</text><text class="dl" x="716" y="94">Drive times and stay lookup</text><text class="dl" x="716" y="114">Estimates if they fail</text></g><g class="node"><rect x="700" y="250" width="240" height="104" rx="12"/><text class="dt" x="716" y="280">SQLite</text><text class="dl" x="716" y="304">Places from OpenStreetMap</text><text class="dl" x="716" y="324">and a hand-checked list</text></g><g class="node"><rect x="20" y="390" width="920" height="64" rx="12"/><text class="dt" x="36" y="420">GitHub Actions</text><text class="dl" x="36" y="444">Lint, 102 backend tests, and a check that the website's types match the API</text></g><g class="edge"><line x1="270" y1="100" x2="346" y2="110" marker-end="url(#ah-lakbaywise-wide)"/><text class="el" x="278" y="92">HTTPS, JSON</text></g><g class="edge"><line x1="270" y1="282" x2="346" y2="160" marker-end="url(#ah-lakbaywise-wide)"/></g><g class="edge"><line x1="485" y1="190" x2="485" y2="246" marker-end="url(#ah-lakbaywise-wide)"/></g><g class="edge"><line x1="620" y1="300" x2="696" y2="300" marker-end="url(#ah-lakbaywise-wide)"/><text class="el" x="646" y="292">SQL</text></g><g class="edge"><line x1="620" y1="92" x2="696" y2="92" marker-end="url(#ah-lakbaywise-wide)"/><text class="el" x="626" y="84">drive times</text></g><g class="edge faint"><line x1="145" y1="334" x2="145" y2="386" marker-end="url(#ah-lakbaywise-wide)"/></g></svg>
